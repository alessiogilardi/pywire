[project]
name = "pywire"
version = "0.3.1"
description = "A minimal Dependency Injection container inspired by Spring's @Component and @Autowired"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "pytest>=8.0.0",
    "pyright>=1.1.411",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["pywire"]
